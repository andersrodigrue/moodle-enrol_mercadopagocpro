name: PHP syntax

on:
  push:
    branches:
      - develop
      - main
      - 'fix/**'
  pull_request:

jobs:
  php-lint:
    name: PHP 8.3 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate first-party PHP files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
